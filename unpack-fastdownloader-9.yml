name: Unpack FastDownloader ZIP

on:
  push:
    paths:
      - "FastDownloader-GitHub.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p /tmp/fastdownloader
          unzip -o FastDownloader-GitHub.zip -d /tmp/fastdownloader
          cp -R /tmp/fastdownloader/. .
          rm -f FastDownloader-GitHub.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import FastDownloader project"
          git push
